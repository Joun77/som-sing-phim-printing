services:
  db:
    image: postgres:15-alpine
    container_name: somsing_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: somsing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./admin-system/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d somsing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./admin-system/backend
      dockerfile: Dockerfile
    container_name: somsing_backend
    restart: always
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/somsing_db?sslmode=disable
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: somsing_db
      DB_SSLMODE: disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  admin-system:
    build:
      context: ./admin-system/frontend
      dockerfile: Dockerfile
    container_name: somsing_admin_system
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: somsing_customer_service
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
