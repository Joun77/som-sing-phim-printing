services:
  db:
    image: postgres:15-alpine
    container_name: somsing_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-somsing_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./admin-system/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-somsing_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./admin-system/backend
      dockerfile: Dockerfile
    container_name: somsing_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-somsing_db}?sslmode=disable}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-somsing_db}
      DB_SSLMODE: disable
      PORT: ${BACKEND_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-somsing_super_secret_jwt_key_2026}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  admin-system:
    build:
      context: ./admin-system/frontend
      dockerfile: Dockerfile
    container_name: somsing_admin_system
    restart: always
    ports:
      - "${ADMIN_PORT:-3000}:80"
    depends_on:
      - backend

  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: somsing_customer_service
    restart: always
    ports:
      - "${CUSTOMER_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
