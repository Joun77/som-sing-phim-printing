<!DOCTYPE html>
<html lang="th" class="h-full bg-zinc-950 text-zinc-100 selection:bg-brand-500 selection:text-zinc-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paper & Material Guide - Som Sing Phim Printing</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js for Minimal Reactive UI & Dropdowns -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts: Prompt & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fdfbf7',
              100: '#f7f1e7',
              200: '#eddcb5',
              500: '#d9a74a',
              600: '#b88330',
              900: '#1c160e',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    /* CSS Simulated Paper Textures */
    .texture-artcard {
      background: linear-gradient(135deg, #ffffff 0%, #e4e4e7 100%);
      box-shadow: inset 0 0 12px rgba(255,255,255,0.9);
    }
    .texture-glossy {
      background: linear-gradient(135deg, #ffffff 0%, #d4d4d8 50%, #ffffff 100%);
      position: relative;
    }
    .texture-glossy::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(45deg, transparent 35%, rgba(255,255,255,0.8) 50%, transparent 65%);
      pointer-events: none;
    }
    .texture-matte {
      background: #f4f4f5;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.05);
    }
    .texture-woodfree {
      background: #fafaf9;
      background-image: radial-gradient(#d6d3d1 0.75px, transparent 0.75px);
      background-size: 8px 8px;
    }
    .texture-kraft {
      background: #c89552;
      background-image: radial-gradient(#a37237 1px, transparent 1px), radial-gradient(#d8a86a 1px, #c89552 1px);
      background-size: 10px 10px;
      background-position: 0 0, 5px 5px;
    }
    .texture-velvet {
      background: linear-gradient(135deg, #27272a 0%, #09090b 100%);
      box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
    }
    .texture-linen {
      background: #f8fafc;
      background-image: repeating-linear-gradient(0deg, #cbd5e1, #cbd5e1 1px, transparent 1px, transparent 4px),
                        repeating-linear-gradient(90deg, #cbd5e1, #cbd5e1 1px, transparent 1px, transparent 4px);
    }
    .texture-pearl {
      background: linear-gradient(135deg, #fef3c7 0%, #fde047 25%, #f472b6 50%, #38bdf8 75%, #fef3c7 100%);
      opacity: 0.9;
    }
    .texture-sticker {
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
      border: 2px dashed #94a3b8;
    }
  </style>
</head>

<body 
  class="h-full font-sans antialiased text-zinc-100 bg-zinc-950"
  x-data="paperGuideSidebarApp()"
  x-init="initApp()"
>

  <!-- Global App Layout with Left Sidebar -->
  <div class="flex h-screen overflow-hidden">

    <!-- LEFT SIDEBAR NAVIGATION -->
    <aside 
      :class="isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
      class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col border-r border-zinc-800/80 bg-zinc-950 transition-transform duration-300 ease-in-out lg:static lg:z-auto"
    >
      <!-- Sidebar Header / Logo -->
      <div class="flex h-16 items-center justify-between border-b border-zinc-800/80 px-5">
        <a href="#" @click="resetToAll()" class="flex items-center gap-3">
          <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-brand-500 text-zinc-950 shadow-md shadow-brand-500/10">
            <i data-lucide="layers" class="h-5 w-5"></i>
          </div>
          <div>
            <span class="block text-[10px] font-bold tracking-widest text-brand-500 uppercase">Som Sing Phim</span>
            <span class="block text-xs font-semibold text-zinc-100">Paper & Spec Guide</span>
          </div>
        </a>

        <!-- Mobile Close Button -->
        <button 
          @click="isMobileMenuOpen = false" 
          class="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-900 hover:text-white lg:hidden"
        >
          <i data-lucide="x" class="h-5 w-5"></i>
        </button>
      </div>

      <!-- Sidebar Navigation Links with Dropdowns -->
      <div class="flex-1 overflow-y-auto p-4 space-y-6">
        
        <!-- Search Box inside Sidebar -->
        <div class="relative">
          <i data-lucide="search" class="absolute left-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-zinc-500"></i>
          <input 
            type="text" 
            x-model="searchQuery" 
            @input="selectedPaperId = null; activeTab = 'catalog'"
            placeholder="ค้นหากระดาษ, GSM..." 
            class="w-full rounded-xl border border-zinc-800 bg-zinc-900/90 pl-8 pr-3 py-2 text-xs text-zinc-100 placeholder-zinc-500 outline-none transition focus:border-brand-500"
          />
        </div>

        <!-- MENU GROUP 1: PAPERS & MATERIALS (ACCORDION DROPDOWNS) -->
        <div class="space-y-1">
          <div class="px-2 text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">
            หมวดหมู่กระดาษ (Paper Types)
          </div>

          <!-- All Papers Button -->
          <button 
            @click="selectedCategory = 'all'; selectedPaperId = null; activeTab = 'catalog'"
            :class="selectedCategory === 'all' && !selectedPaperId ? 'bg-zinc-800/90 text-brand-500 font-semibold border-l-2 border-brand-500' : 'text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/60'"
            class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-xs transition"
          >
            <span class="flex items-center gap-2.5">
              <i data-lucide="files" class="h-4 w-4"></i>
              <span>กระดาษทั้งหมด</span>
            </span>
            <span class="rounded-full bg-zinc-900 px-2 py-0.5 text-[10px] text-zinc-500" x-text="paperList.length"></span>
          </button>

          <!-- CATEGORY 1: ART PAPER (ACCORDION) -->
          <div class="space-y-0.5" x-data="{ open: true }">
            <button 
              @click="open = !open; selectedCategory = 'art'; selectedPaperId = null; activeTab = 'catalog'"
              class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-xs font-medium text-zinc-300 hover:bg-zinc-900 transition"
            >
              <span class="flex items-center gap-2.5">
                <i data-lucide="file-image" class="h-4 w-4 text-amber-400"></i>
                <span>กระดาษอาร์ต (Art Paper)</span>
              </span>
              <i data-lucide="chevron-down" class="h-3.5 w-3.5 text-zinc-500 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
            </button>

            <!-- Dropdown Sub-Items -->
            <div x-show="open" x-collapse class="pl-7 pr-2 space-y-1 pt-1 pb-2">
              <template x-for="paper in getPapersByCategory('art')" :key="paper.id">
                <button 
                  @click="selectPaper(paper)"
                  :class="selectedPaperId === paper.id ? 'bg-brand-500/10 text-brand-400 font-medium border-l-2 border-brand-500' : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/50'"
                  class="flex w-full items-center justify-between rounded-lg px-2.5 py-1.5 text-xs transition text-left"
                >
                  <span class="truncate" x-text="paper.name"></span>
                  <span class="text-[10px] text-zinc-500 ml-1" x-text="paper.gsm + 'g'"></span>
                </button>
              </template>
            </div>
          </div>

          <!-- CATEGORY 2: WOODFREE / BOND (ACCORDION) -->
          <div class="space-y-0.5" x-data="{ open: false }">
            <button 
              @click="open = !open; selectedCategory = 'uncoated'; selectedPaperId = null; activeTab = 'catalog'"
              class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-xs font-medium text-zinc-300 hover:bg-zinc-900 transition"
            >
              <span class="flex items-center gap-2.5">
                <i data-lucide="file-text" class="h-4 w-4 text-blue-400"></i>
                <span>กระดาษปอนด์ / A4 (Woodfree)</span>
              </span>
              <i data-lucide="chevron-down" class="h-3.5 w-3.5 text-zinc-500 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
            </button>

            <div x-show="open" x-collapse class="pl-7 pr-2 space-y-1 pt-1 pb-2">
              <template x-for="paper in getPapersByCategory('uncoated')" :key="paper.id">
                <button 
                  @click="selectPaper(paper)"
                  :class="selectedPaperId === paper.id ? 'bg-brand-500/10 text-brand-400 font-medium border-l-2 border-brand-500' : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/50'"
                  class="flex w-full items-center justify-between rounded-lg px-2.5 py-1.5 text-xs transition text-left"
                >
                  <span class="truncate" x-text="paper.name"></span>
                  <span class="text-[10px] text-zinc-500 ml-1" x-text="paper.gsm + 'g'"></span>
                </button>
              </template>
            </div>
          </div>

          <!-- CATEGORY 3: KRAFT (ACCORDION) -->
          <div class="space-y-0.5" x-data="{ open: false }">
            <button 
              @click="open = !open; selectedCategory = 'kraft'; selectedPaperId = null; activeTab = 'catalog'"
              class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-xs font-medium text-zinc-300 hover:bg-zinc-900 transition"
            >
              <span class="flex items-center gap-2.5">
                <i data-lucide="leaf" class="h-4 w-4 text-emerald-400"></i>
                <span>กระดาษคราฟท์ (Kraft Vintage)</span>
              </span>
              <i data-lucide="chevron-down" class="h-3.5 w-3.5 text-zinc-500 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
            </button>

            <div x-show="open" x-collapse class="pl-7 pr-2 space-y-1 pt-1 pb-2">
              <template x-for="paper in getPapersByCategory('kraft')" :key="paper.id">
                <button 
                  @click="selectPaper(paper)"
                  :class="selectedPaperId === paper.id ? 'bg-brand-500/10 text-brand-400 font-medium border-l-2 border-brand-500' : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/50'"
                  class="flex w-full items-center justify-between rounded-lg px-2.5 py-1.5 text-xs transition text-left"
                >
                  <span class="truncate" x-text="paper.name"></span>
                  <span class="text-[10px] text-zinc-500 ml-1" x-text="paper.gsm + 'g'"></span>
                </button>
              </template>
            </div>
          </div>

          <!-- CATEGORY 4: SPECIALTY CARD (ACCORDION) -->
          <div class="space-y-0.5" x-data="{ open: false }">
            <button 
              @click="open = !open; selectedCategory = 'specialty'; selectedPaperId = null; activeTab = 'catalog'"
              class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-xs font-medium text-zinc-300 hover:bg-zinc-900 transition"
            >
              <span class="flex items-center gap-2.5">
                <i data-lucide="sparkles" class="h-4 w-4 text-purple-400"></i>
                <span>กระดาษพิเศษ / การ์ดหรู</span>
              </span>
              <i data-lucide="chevron-down" class="h-3.5 w-3.5 text-zinc-500 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
            </button>

            <div x-show="open" x-collapse class="pl-7 pr-2 space-y-1 pt-1 pb-2">
              <template x-for="paper in getPapersByCategory('specialty')" :key="paper.id">
                <button 
                  @click="selectPaper(paper)"
                  :class="selectedPaperId === paper.id ? 'bg-brand-500/10 text-brand-400 font-medium border-l-2 border-brand-500' : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/50'"
                  class="flex w-full items-center justify-between rounded-lg px-2.5 py-1.5 text-xs transition text-left"
                >
                  <span class="truncate" x-text="paper.name"></span>
                  <span class="text-[10px] text-zinc-500 ml-1" x-text="paper.gsm + 'g'"></span>
                </button>
              </template>
            </div>
          </div>

          <!-- CATEGORY 5: STICKER (ACCORDION) -->
          <div class="space-y-0.5" x-data="{ open: false }">
            <button 
              @click="open = !open; selectedCategory = 'sticker'; selectedPaperId = null; activeTab = 'catalog'"
              class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-xs font-medium text-zinc-300 hover:bg-zinc-900 transition"
            >
              <span class="flex items-center gap-2.5">
                <i data-lucide="tag" class="h-4 w-4 text-rose-400"></i>
                <span>สติกเกอร์ / ฉลากสินค้า</span>
              </span>
              <i data-lucide="chevron-down" class="h-3.5 w-3.5 text-zinc-500 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
            </button>

            <div x-show="open" x-collapse class="pl-7 pr-2 space-y-1 pt-1 pb-2">
              <template x-for="paper in getPapersByCategory('sticker')" :key="paper.id">
                <button 
                  @click="selectPaper(paper)"
                  :class="selectedPaperId === paper.id ? 'bg-brand-500/10 text-brand-400 font-medium border-l-2 border-brand-500' : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/50'"
                  class="flex w-full items-center justify-between rounded-lg px-2.5 py-1.5 text-xs transition text-left"
                >
                  <span class="truncate" x-text="paper.name"></span>
                  <span class="text-[10px] text-zinc-500 ml-1" x-text="paper.gsm + 'g'"></span>
                </button>
              </template>
            </div>
          </div>

        </div>

        <!-- MENU GROUP 2: TOOLS & FINISHING KNOWLEDGE -->
        <div class="space-y-1 pt-2 border-t border-zinc-900">
          <div class="px-2 text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">
            เครื่องมือ & คลังความรู้
          </div>

          <button 
            @click="activeTab = 'finishing'; selectedPaperId = null"
            :class="activeTab === 'finishing' ? 'bg-zinc-800 text-brand-500 font-semibold' : 'text-zinc-400 hover:text-white hover:bg-zinc-900'"
            class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-xs transition"
          >
            <i data-lucide="scissors" class="h-4 w-4 text-zinc-400"></i>
            <span>เทคนิคการเคลือบ & พับ</span>
          </button>

          <button 
            @click="activeTab = 'simulator'; selectedPaperId = null"
            :class="activeTab === 'simulator' ? 'bg-zinc-800 text-brand-500 font-semibold' : 'text-zinc-400 hover:text-white hover:bg-zinc-900'"
            class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-xs transition"
          >
            <i data-lucide="sliders" class="h-4 w-4 text-zinc-400"></i>
            <span>ทดลองแกรม (GSM Simulator)</span>
          </button>

          <button 
            @click="activeTab = 'matrix'; selectedPaperId = null"
            :class="activeTab === 'matrix' ? 'bg-zinc-800 text-brand-500 font-semibold' : 'text-zinc-400 hover:text-white hover:bg-zinc-900'"
            class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-xs transition"
          >
            <i data-lucide="table" class="h-4 w-4 text-zinc-400"></i>
            <span>ตารางเปรียบเทียบสเปก</span>
          </button>
        </div>

      </div>

      <!-- Sidebar Footer -->
      <div class="border-t border-zinc-800/80 p-4 text-[11px] text-zinc-500">
        <p>&copy; 2026 Som Sing Phim</p>
        <p class="text-[10px] text-zinc-600 mt-0.5">Interactive Material Discovery</p>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA (RIGHT SIDE) -->
    <div class="flex flex-1 flex-col overflow-hidden bg-zinc-950">
      
      <!-- Top Navbar Header -->
      <header class="flex h-16 items-center justify-between border-b border-zinc-800/80 bg-zinc-950/90 px-4 sm:px-6 backdrop-blur-md">
        <div class="flex items-center gap-3">
          <!-- Mobile Toggle Hamburger -->
          <button 
            @click="isMobileMenuOpen = true" 
            class="rounded-xl border border-zinc-800 p-2 text-zinc-400 hover:bg-zinc-900 hover:text-white lg:hidden"
          >
            <i data-lucide="menu" class="h-5 w-5"></i>
          </button>

          <!-- Breadcrumb Title -->
          <div class="flex items-center gap-2 text-xs sm:text-sm">
            <span class="text-zinc-500 hidden sm:inline">คู่มือกระดาษ</span>
            <i data-lucide="chevron-right" class="h-4 w-4 text-zinc-600 hidden sm:inline"></i>
            <span class="font-semibold text-zinc-100" x-text="getCurrentBreadcrumb()"></span>
          </div>
        </div>

        <!-- Quick Top Actions -->
        <div class="flex items-center gap-3">
          <button 
            @click="openCompareModal()"
            class="relative flex items-center gap-2 rounded-xl border border-zinc-800 bg-zinc-900 px-3.5 py-1.5 text-xs font-medium text-zinc-200 transition hover:border-brand-500 hover:text-white"
          >
            <i data-lucide="columns" class="h-4 w-4 text-brand-500"></i>
            <span class="hidden sm:inline">เปรียบเทียบ</span>
            <span 
              x-show="compareList.length > 0" 
              class="flex h-4.5 w-4.5 items-center justify-center rounded-full bg-brand-500 text-[10px] font-bold text-zinc-950"
              x-text="compareList.length"
            ></span>
          </button>
        </div>
      </header>

      <!-- Main Scrollable Content Panel -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-8">

        <!-- VIEW 1: SINGLE SELECTED PAPER SPEC DETAIL (When user clicks a specific item from sidebar) -->
        <template x-if="selectedPaper">
          <div class="space-y-6">
            
            <!-- Back Button -->
            <button 
              @click="selectedPaperId = null" 
              class="inline-flex items-center gap-2 rounded-xl bg-zinc-900 border border-zinc-800 px-3.5 py-1.5 text-xs text-zinc-400 hover:text-white transition"
            >
              <i data-lucide="arrow-left" class="h-4 w-4"></i>
              <span>กลับไปดูรายการทั้งหมด</span>
            </button>

            <!-- Detailed Spec Banner Card -->
            <div class="overflow-hidden rounded-3xl border border-zinc-800 bg-zinc-900/90 shadow-2xl">
              
              <div class="p-6 sm:p-8 space-y-6">
                <!-- Header Info -->
                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 border-b border-zinc-800 pb-6">
                  <div>
                    <div class="flex items-center gap-2 mb-1">
                      <span class="rounded-md bg-brand-500/10 border border-brand-500/20 px-2.5 py-0.5 text-[10px] font-semibold text-brand-400 uppercase" x-text="selectedPaper.categoryName"></span>
                      <span class="text-xs text-zinc-500" x-text="'รหัส: #' + selectedPaper.id"></span>
                    </div>
                    <h2 class="text-2xl font-bold text-white sm:text-3xl" x-text="selectedPaper.name"></h2>
                  </div>

                  <div class="flex items-center gap-3">
                    <span class="rounded-2xl bg-zinc-950 px-4 py-2 text-base font-extrabold text-brand-500 border border-zinc-800" x-text="selectedPaper.gsm + ' GSM'"></span>
                    <button 
                      @click="toggleCompare(selectedPaper.id)"
                      :class="isInCompare(selectedPaper.id) ? 'bg-brand-500 text-zinc-950 border-brand-500' : 'bg-zinc-800 text-zinc-300 border-zinc-700 hover:text-white'"
                      class="flex items-center gap-2 rounded-2xl border px-3.5 py-2 text-xs font-medium transition"
                    >
                      <i data-lucide="columns" class="h-4 w-4"></i>
                      <span x-text="isInCompare(selectedPaper.id) ? 'อยู่ในรายการเปรียบเทียบ' : '+ เพิ่มในการเปรียบเทียบ'"></span>
                    </button>
                  </div>
                </div>

                <!-- Simulated Texture Large Banner -->
                <div 
                  class="relative h-44 w-full overflow-hidden rounded-2xl border border-zinc-700/60 p-5 flex flex-col justify-between shadow-inner"
                  :class="selectedPaper.textureClass"
                >
                  <div class="flex justify-between items-start">
                    <span class="rounded-lg bg-zinc-950/80 backdrop-blur-md px-3 py-1 text-xs font-semibold text-zinc-100 border border-zinc-800">
                      ผิวสัมผัสจำลอง (Simulated Texture)
                    </span>
                  </div>

                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="rounded-lg bg-zinc-950/80 backdrop-blur-md px-3 py-1 text-xs text-zinc-300 border border-zinc-800">
                      ลักษณะผิว: <strong class="text-white ml-1" x-text="selectedPaper.finish"></strong>
                    </span>
                    <span class="rounded-lg bg-zinc-950/80 backdrop-blur-md px-3 py-1 text-xs text-brand-400 font-semibold border border-zinc-800">
                      ระดับความแข็งแรง: <span x-text="getThicknessLabel(selectedPaper.gsm)"></span>
                    </span>
                  </div>
                </div>

                <!-- Technical Specification Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                  
                  <div class="space-y-4">
                    <div>
                      <h4 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1">คำอธิบายและลักษณะเนื้อกระดาษ</h4>
                      <p class="text-sm text-zinc-300 leading-relaxed" x-text="selectedPaper.description"></p>
                    </div>

                    <div class="rounded-2xl bg-emerald-950/20 border border-emerald-500/20 p-4 space-y-1.5">
                      <div class="flex items-center gap-1.5 text-xs font-bold text-emerald-400">
                        <i data-lucide="check-circle" class="h-4 w-4"></i>
                        <span>จุดเด่นสำคัญ</span>
                      </div>

        initApp() {
          this.$nextTick(() => {
            if (window.lucide) lucide.createIcons();
          });
        },

        get selectedPaper() {
          if (!this.selectedPaperId) return null;
          return this.paperList.find(p => p.id === this.selectedPaperId) || null;
        },

        get filteredPapers() {
          return this.paperList.filter(paper => {
            const query = this.searchQuery.toLowerCase().trim();
            const matchesSearch = !query || 
              paper.name.toLowerCase().includes(query) ||
              paper.finish.toLowerCase().includes(query) ||
              paper.description.toLowerCase().includes(query) ||
              paper.suitableFor.some(s => s.toLowerCase().includes(query));

            const matchesCat = this.selectedCategory === 'all' || paper.category === this.selectedCategory;

            return matchesSearch && matchesCat;
          });
        },

        get simulatedRecommendation() {
          const gsm = this.gsmSimValue;
          if (gsm < 100) {
            return {
              category: 'บางเบา (Lightweight Paper)',
              feelDescription: 'เนื้อกระดาษบาง พับง่าย เหมาะสำหรับเนื้อหาหลายๆ หน้า หรือเอกสารสำนักงาน A4',
              recommendedItems: ['กระดาษปอนด์ 80g', 'หัวจดหมาย', 'ไส้ในสมุด', 'ใบเสร็จรับเงิน']
            };
          } else if (gsm <= 180) {
            return {
              category: 'ความหนามาตรฐาน (Standard Flyer/Brochure)',
              feelDescription: 'กระดาษหนากำลังดี พิมพ์สีสด ไม่หนาตึงเกินไป พับแล้วเรียบสวยงาม',
              recommendedItems: ['กระดาษอาร์ตมัน 130g', 'โบรชัวร์', 'แผ่นพับ 3 ตอน', 'แคตตาล็อกสินค้า']
            };
          } else if (gsm <= 260) {
            return {
              category: 'หนากลาง / การ์ดอ่อน (Semi-Rigid Card)',
              feelDescription: 'กระดาษเริ่มมีความแข็งตัว ไม่งอง่าย ให้ความรู้สึกมีราคา',
              recommendedItems: ['กระดาษคราฟท์ 250g', 'การ์ดเดินลายผ้า', 'ป้ายแท็กเสื้อผ้า', 'ถุงกระดาษ']
            };
          } else {
            return {
              category: 'หนาพิเศษ / การ์ดแข็ง (Heavy Duty Cardboard)',
              feelDescription: 'กระดาษหนาแน่นสูง แข็งแรงทนทาน ไม่งอตัวง่าย ต้องทำรอยพับก่อนดัด',
              recommendedItems: ['อาร์ตการ์ด 300g', 'นามบัตร VIP', 'กล่องบรรจุภัณฑ์', 'ปกหนังสือ']
            };
          }
        },

        get compareItems() {
          return this.paperList.filter(p => this.compareList.includes(p.id));
        },

        getPapersByCategory(catId) {
          return this.paperList.filter(p => p.category === catId);
        },

        getThicknessLabel(gsm) {
          if (gsm < 90) return 'บางเบา (Lightweight)';
          if (gsm <= 160) return 'ความหนามาตรฐาน (Medium)';
          if (gsm <= 260) return 'หนากลาง (Semi-Rigid)';
          return 'หนาพิเศษ/การ์ด (Heavy Card)';
        },

        getCurrentBreadcrumb() {
          if (this.selectedPaper) {
            return this.selectedPaper.name;
          }
          if (this.activeTab === 'simulator') return 'ทดลองแกรม (GSM Simulator)';
          if (this.activeTab === 'matrix') return 'ตารางเปรียบเทียบสเปก';
          if (this.activeTab === 'finishing') return 'เทคนิคการเคลือบ & พับ';
          
          if (this.selectedCategory === 'art') return 'กระดาษอาร์ต (Art Paper)';
          if (this.selectedCategory === 'uncoated') return 'กระดาษปอนด์ / A4 (Woodfree)';
          if (this.selectedCategory === 'kraft') return 'กระดาษคราฟท์ (Kraft)';
          if (this.selectedCategory === 'specialty') return 'กระดาษพิเศษ (Specialty)';
          if (this.selectedCategory === 'sticker') return 'สติกเกอร์ (Sticker)';
          
          return 'รายการกระดาษทั้งหมด';
        },

        selectPaper(paper) {
          this.selectedPaperId = paper.id;
          this.activeTab = 'catalog';
          if (window.innerWidth < 1024) {
            this.isMobileMenuOpen = false;
          }
          this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
        },

        applyPreset(preset) {
          this.selectedPreset = preset.id;
          this.selectedCategory = preset.category;
          this.selectedPaperId = preset.paperId;
          this.searchQuery = '';
          this.activeTab = 'catalog';
        },

        resetFilters() {
          this.searchQuery = '';
          this.selectedCategory = 'all';
          this.selectedPreset = 'all';
          this.selectedPaperId = null;
          this.activeTab = 'catalog';
        },

        resetToAll() {
          this.resetFilters();
          this.isMobileMenuOpen = false;
        },

        toggleCompare(id) {
          if (this.compareList.includes(id)) {
            this.compareList = this.compareList.filter(item => item !== id);
          } else {
            if (this.compareList.length >= 3) {
              alert('คุณสามารถเลือกเปรียบเทียบได้สูงสุด 3 รายการพร้อมกัน');
              return;
            }
            this.compareList.push(id);
          }
        },

        isInCompare(id) {
          return this.compareList.includes(id);
        },

        openCompareModal() {
          this.isCompareModalOpen = true;
          this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
        }
      }
    }
